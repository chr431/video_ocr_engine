- id: R-truth-unknown-marked
  statement: 视觉真值链只在与引擎读数一致的帧上自动放行；未读出（看不清）与分歧帧一律记为「未知」并进审查面，禁止用连续性或物理推断把未知填成数字——「不知道」与「错」是两种东西，混同会把审查面算小、把错误藏进已放行面。**充分性边界（C-95）**：一致性是必要条件不是充分条件——盲读协议下同一模型仍有 8 例"一致且都错"，故连续性/多读投票若参与放行，必须作为**显式声明的推断阶段**记录，不得混进"直读"面
