  enforcement: ci
  executor: .github/workflows/ci.yml#test
  prevents: 离线纪律缺位（无 GPU CI 上假绿）
  since: 2026-09-16
  env: "无网/无 GPU/无视频（依赖者带 skip 守卫或 -m gpu）"
  negative: "协议内建（skip 守卫协议：无依赖时显式 SKIP，不冒充通过）"

