# 旧 rules.yaml"大文档禁整读"（hook 档） → 删除，裁决 9（harness 无关）+大档案出树。
# 旧 rules.yaml"历史文档 append-only" → 删除，被生命周期政策取代（log 发版出树）。
# 旧 rules.yaml"不引用废弃根模块 shim" → 删除（shims 已于 0.14.1 物理删除，规则随之失效）。
# 旧 rules.yaml"数值不重排/测量原语复用/压测规格"（prose 档） → 收编为上方 advisory。
# 旧 rules.yaml"标定/实验期间机器独占，后台任务禁止并行" → 机器化为 R-perf-quiet。
# 旧铁律 1/3/4/5（测量文化） → 收编为 adv-measure-first/frame-align/per-slice/gt-audit。
# 旧铁律 7"探针放 tools/_probe_*.py" → 演化为 R-registry-schema 的路径约定（tools/probes/）。
