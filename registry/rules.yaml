# 规则注册表（唯一事实源）——S1 精神"可执行"的落点
#
# 字段：
#   id          命名 id（R- 前缀=可执行规则；adv- 前缀=方向性提醒，硬上限 10 席）
#   statement   规则一句话
#   enforcement ci（线上 CI 步骤）| local-gate（本机门禁）| advisory（无执行体）
#   executor    执行体（文件路径或 CI 步骤名；advisory 为空）
#   prevents    所防事故（S0 痛点 id 或历史 commit/事件），举证义务
#   since       生效日期
#
# 生命周期：executor 消失即删；12 个月无命中提示复评。advisory 满额须"自动化或删除"。
#
# ── ci：线上 CI（机器无关） ────────────────────────────────────────────

- id: R-lint-format
  statement: 代码风格单一执行面——ruff format（双引号、行宽 100）+ lint 精选集；面以 pyproject [tool.ruff] 为唯一描述源（裸命令跑全仓，尊重 .gitignore；probes/ 与 *.md 不入）
  enforcement: ci
  executor: pyproject.toml#[tool.ruff]（CI lint job 与本地 daily 链均裸命令）
  prevents: S0-I1（52 天无风格约束、42 文件返工、tools/tests 豁免）
  since: 2026-10-10
  env: "ruff（钉版；面=全仓 py，默认尊重 .gitignore）"
  negative: "工具内建"

- id: R-mypy
  statement: 类型面以 pyproject [tool.mypy].files 为唯一描述源（面内文件显式列举；probes/ 不在面内，未列入模块按 Any 不跟随）
  enforcement: ci
  executor: pyproject.toml#[tool.mypy]（CI lint job 与本地 daily 链同命令）
  prevents: S0-I1（工具层无类型面）
  since: 2026-10-12
  env: "mypy（钉版；面=pyproject [tool.mypy].files）"
  negative: "工具内建"

- id: R-pytest-offline
