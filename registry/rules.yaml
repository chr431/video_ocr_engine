# ── advisory：方向性提醒（10 席已满额；满额即"自动化或删除"） ─────────
# 无执行体的文化条款住这里；满额即"自动化或删除"。每条 prevent 仍是真实事故。

- id: adv-measure-first
  statement: 先量后做——结论必须带实测数字（evidence schema 强制），禁止凭直觉推断下结论
  enforcement: advisory
  prevents: 无实测数字即下结论
  since: 2026-08-20

- id: adv-frame-align
  statement: 准确率必须按帧对齐真值测，勿用置信度代理（"羸弱→赢弱"退化而置信度反升 0.9433→0.9700）
  enforcement: advisory
  prevents: 用置信度代理准确率
  since: 2026-09-12

- id: adv-per-slice
  statement: 逐片核查，均值不作唯一判据（5 片均值 ±0.01pp 曾支持"无负面影响"，第 6 片翻案）
  enforcement: advisory
  prevents: 均值掩盖逐片差异（第 6 片翻案）
  since: 2026-09-12

- id: adv-gt-audit
  statement: 真值本身要抽查——版本、剥零、哨兵、时间基准都可能错（曾据此翻案）
  enforcement: advisory
  prevents: 真值未经抽查即采信
  since: 2026-09-10

- id: adv-no-numeric-reshuffle
  statement: 数值不重排——重构不改任何算法数值/阈值语义；行为变更走金标重录
  enforcement: advisory
  prevents: 重构顺手改算法数值（无金标重录）
  since: 2026-09-16

- id: adv-reuse-primitives
  statement: 测量原语复用——先 import tools/_measure_lib.py（VIDS/ROI/capture_shas/paired_ab）；同一原语第 3 份实现必须下沉入库
  enforcement: advisory
  prevents: S0-I2（paired_ab 零调用者、ROI 正则 7 份拷贝）
  since: 2026-10-11

- id: adv-record-via-existing
  statement: 录金标/跑 A/B 用既有脚本（bench_baseline/bench ab），不自写对照探针
  enforcement: advisory
  prevents: S0-I2（5 探针各写 AB/BA 轮转）
  since: 2026-09-16

- id: adv-stress-harness
  statement: 压测/复现子进程必须带硬超时且进度逐行落文件——管道吞 stdout 会把挂死伪装成在跑（735s/1543s 两坑）
  enforcement: advisory
  prevents: 压测子进程无硬超时（同款坑三次）
  since: 2026-09-17

- id: adv-commit-slim
  statement: 提交信息=结果一句话+指针（结论进注册表、叙事进当轮 log），正文建议 ≤600 字符
  enforcement: advisory
  prevents: S0-E4（提交正文均长 523 字符、max 792）
  since: 2026-10-12

- id: adv-comment-present-tense
  statement: 注释只描述现状（约束/不变量/失败模式/禁令，现在时）；历史坐标（旧计划编号/版本归属/出树文档引用）删除或现在时化——历史看 git。判据=git log 测试：可被 git log -S 同等恢复的事实不写注释。负面知识（被否决选项）删前必须已入 conclusions。活标识（C-NN 结论/R-名 规则/PI-N 门禁/fork@C-NN 外部编号/S0-痛点）不是历史坐标，保留
  enforcement: advisory
  prevents: S0-D 类悬空 + 注释-注册表双事实源（129 处旧编号考古痕迹）
  since: 2026-10-12
  note: 结论出源时其引用点复核同循本原则（sweep 墓碑清单供逐点核对）
