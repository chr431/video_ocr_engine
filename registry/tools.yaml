# 工具注册表——standing/probe 分级（裁决 18）的唯一事实源
#
# tier 判据（机器可判，不靠"常用"直觉）：
#   standing = 被规则 executor 引用，或被产品/测试 import，或为测量/门禁基建
#              → 质量面与生产代码相等（lint/format/mypy/自身测试，R-lint-format/R-mypy）
#   probe    = 仅作为结论证据存在 → 近两轮出树（宪章 4；rounds_used Phase C 填）
# 物理分层：standing 住 tools/，probe 于 Phase C 迁 tools/probes/（R-registry-schema 校验路径）。
# live 探针修复义务=standing；probe 无修复义务（frozen 语义）。

