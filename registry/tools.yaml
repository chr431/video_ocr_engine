# 工具注册表——standing/probe 分级（裁决 18）的唯一事实源
#
# tier 判据（机器可判，不靠"常用"直觉）：
#   standing = 被规则 executor 引用，或被产品/测试 import，或为测量/门禁基建
#              → 质量面与生产代码相等（lint/format/mypy/自身测试，R-lint-format/R-mypy）
#   probe    = 仅作为结论证据存在 → 近两轮出树（宪章 4；轮=发版）
# 物理分层：standing 住 tools/，probe 住 tools/probes/（R-registry-schema 校验路径）。
# 本表由 tools/INDEX.md 渲染呈现；历史探针不在树（git 档案，archive/pre-rework 起）。

- id: _audit_ext.py
  tier: standing
  why: 结构化审计（按名注册）：layering/knob/hooks/render/decord_pin/rules_schema 等
- id: _measure_lib.py
  tier: standing
  why: 测量原语库（VIDS/ROI/capture_shas/paired_ab）
- id: _probe_hooks.py
  tier: standing
  why: R-probe-hooks-points 执行体（POINTS 打桩表）
- id: _probe_run_setup_cost.py
  tier: standing
