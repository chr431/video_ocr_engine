  conclusion: '**盲读复测推翻了 C-93 的一致性充分性：把顺序打乱、id 换成乱序编号、去掉一切领域上下文后，同一模型（deepseek-v4.1-flash，同 3317 个裁剪）错读 6→25（0.18%→0.75%，全部为差>1 的实质错读），而**拒答率几乎不动（2.86%→2.83%）**——所以此前的上下文不是让读者"更少猜"，而是把"猜错"变成了"猜对"；且盲读下出现 **8 例"与引擎一致且都错"**（带上下文协议下同一指标为 0）。①分视频：清晰视频 test3 盲读仍 100%（1144/1144，与带上下文相同）；扁字体 test5 3→5 错；模糊 video 3→20 错（6.11% 拒答不变）——上下文的价值全部集中在"像素部分可辨、靠连续性可以补全"的那一档，这正是真值获取最不该自动化的地方：**连续性推断是在"制造"读数而不是"读"读数**（先例=test4_truth 事后判完全不可用，其 12 个"混合段"即推断产物）。②失败形态差异给设计定了方向：盲读的 25 个错读里 8 个与引擎同错（如 100/180、16/167、101/103，均为部分遮挡），说明**共享盲点来自"两边都在看同一块残缺像素"，与模型无关**；而对照的 17 个是分歧（引擎读对、盲读错，如 138/136、228/223）——即分歧面仍能抓到 2/3。③因此闸门必须是"必要条件"式叠加而非单一充分判据：直读面（盲读）+ 与引擎一致 + 多读投票/显式时序推断阶段 + 剩余人审；任何由连续性补出的值必须落进"推断"面单独记录，不得混入直读面（规则 R-truth-unknown-marked 已按此边界改写）。④对 C-93 的净修正：其"自动放行面零错误、审查面 3.3-3.6%"是**带上下文协议的读数**，不能作为盲读协议的结论；盲读口径下的诚实读数是 96.4% 直读正确 + 2.8% 拒答 + 0.75% 错读（其中约 1/3 需靠分歧面以外的闸门拦）。⑤附带：盲读的 7 个"连续模糊区硬核"位置（2732-2734、2744-2747）全部拒答，与带上下文四读全票拒答一致——说明在真正不可辨处读者不会瞎猜，25 个错读都发生在"部分可辨"处'
