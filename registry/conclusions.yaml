  conclusion: '**hybrid_gpu（显存驻留输出）的拖慢全部来自设备侧"每帧"拷贝：上载 H2D 逐帧 + 批装配 D2D 逐帧；宿主输出把 CPU 臂帧留在宿主、由引擎整批 H2D（224KB/次 → 每帧摊 0.33µs），因此"走宿主再上传显存"反而更快**。全片交错 A/B/C（A=hybrid(0)+引擎上传；B=hybrid_gpu+引擎 CPU 流；C=hybrid_gpu+引擎设备直通）：h264 A 7.34 / B 7.83 / C 7.84s（4 轮中位，段数 8340 全同）；av1 A 8.65 / B 8.87 / C 8.79s。FORCE_SIDE 分解（h264/12000 帧）定位亏空：gpu-only（无上载）C 反比 A 快 0.11s（省掉 GPU 臂 D2H）；cpu-only（全上载）C 比 A 慢 0.20s ⇒ 亏空=上载路径。相位（h264）：C 的 decode.batch +0.80s、ocr.trt_enq +1.14s、emit.put/consume_feed 各 +0.48s（CUDA API/CPU 争用外溢到引擎线程）。微基准：小尺寸 H2D/D2H 每次 6.0-7.7µs（4 线程并发 8.3µs/次），引擎整批 H2D 224KB 21µs/次。**上限测算**：即便把设备侧拷贝全部块级批量化（连续块上载 + 合并装配，需 fork 池改 arena + 逐帧视图），C 的每帧成本从 ~14µs 降到 ~1.7µs（CPU 臂）/~0.1µs（GPU 臂），对 A 的 ~2.3µs（h264）/~4.0µs（av1）净胜仅 ~0.3%（h264）/~0.9%（av1）——**零拷贝优势被"引擎整批 H2D 已足够便宜"抵消**。已试调参无收益：DECORD_HYBRID_UPLOAD_WAIT_US 500/1000/1500µs、DECORD_HYBRID_UPLOAD_BATCH 16/32 在设备直通模式下 7.83-7.87s vs 基线 7.88s（同轮交错）。裁决：hybrid 维持宿主输出 + GPU lane（C-85 政策）；hybrid_gpu 保留为实验出口，不再投入批量化改造（收益 <1%，风险=池/装配重写）'
