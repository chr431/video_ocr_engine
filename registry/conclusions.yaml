- id: C-89
  conclusion: '**hybrid 理论性能（两臂速率和）的最后一环已兑现于 fork 层：GPU 帧弹出异步化（转换事件外提 + 流序等待）把 hybrid(0) 的 av1 交付从 8.31-8.54 提到 7.92-8.19s（GPU 臂 1478→1667fps），与 hybrid_gpu 持平——「宿主输出+异步落地 = 设备驻留的交付能力且不付 CPU 臂上载税」**。诊断链：①fork hybrid(0) 交付已到臂率和理想（h264 全片 6.35s vs 臂临界 6.31s；hevc 的 GPU 臂交付=solo 上限 2028fps）——调度（C-85 豁免后）与拷贝（C-87/88 后）均不再是缺口；②唯 av1 差 4-5%：GPU 臂交付 1478fps 而 hybrid_gpu 免 D2H 直通同机 1610-1670fps，归因=落地线程每帧 gpu_->Pop 内联 cudaEventSynchronize（WDDM 下同步=提交队列冲刷+睡眠/唤醒，CPU 臂 32 线程满载时唤醒延迟被放大）；③FORCE_SHARE 扫描证实 GPU 份额提高反而更慢（rg≈940 是 h264 的真实交付上限，busy 口径 1385 不可达——NVDEC h264 本身即三码最慢 915fps solo）。修复（fork d535f45）：ThreadedDecoderInterface 增异步 Pop(frame,**ev)（默认退回同步）；CUThreadedDecoder 事件外提不等待（1 参 Pop 保持同步=NextFrame/NextFrameRoi 宿主直读面不变）；hybrid LandStep D2H 路径 cudaStreamWaitEvent(d2h_stream,ev)+MemcpyAsync（设备侧流序等待与同步逐位等价、零宿主冲刷；GPU 驻留模式维持同步 Pop=入队即完整）；GetBatch 设备批装配同款接事件（RAII 守卫）。**引擎 e2e 口径（全片 5 轮交错）：hybrid h264 −0.5%（7.29→7.25s）、hevc +0.2%/av1 −0.2%（噪声内）、nvdec/cpu 不变**——fork 层 av1 的 4-5% 不落引擎墙钟，因引擎负载下 av1 的 CPU 臂（争用后 ~1250fps）是关键路径，GPU 臂上限提升不移动瓶颈。**hybrid_gpu 裁决强化**：C-86「批量化不投入」经此更廉路径再确认——异步落地以 ~40 行达到设备驻留模式的交付能力（无需 arena/装配重写），C-76 宿主输出政策获更强证据。**剩余缺口定位（引擎侧，非 hybrid 特有，~0.7-0.9s=10-12%）**：pre-run 0.276s（open 0.11 + 构造/会话）+ 尾部 0.445s（ocr_tail 0.053 + close 0.04 + machine.finish/after_stream/release ~0.35）——下一步若要逼近臂率和理论，杠杆在引擎头尾重叠（会话构造与 open 并行、finish 收尾流水化），与 lane/驻留无关'
