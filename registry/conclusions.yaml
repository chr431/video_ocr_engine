- id: C-93
  conclusion: '**真值获取改为「异源视觉读者 + 一致面放行」：3317 个真实代表帧上错读 0（旧读者）/6（更便宜的换型读者，0.18%），而「视觉与引擎读数一致」的帧上两代读者**一致且都错 = 0 例**——故自动放行面 96.4-96.7% 零错误，审查面收到 3.3-3.6%（旧读者）或 8.2%（新读者，含引擎无读数帧）。**⚠ 该"零相关误差"限带上下文协议（后附 C-95 盲读复测推翻了它的充分性：去打乱顺序并去掉领域上下文后，同一模型错读 0.18%→0.75%，且出现 8 例"一致且都错"）——本条的准确主张应为：一致性闸门是必要条件而非充分条件，充分性依赖连续性先验。**失败形态是本次最有价值的部分：视觉读者在像素确实无法判定处**拒答**（test.mp4 模糊区 6.2-6.4%、清晰视频 0%），而引擎在同一批帧上错 65 处且一次不拒答（其中 2 处标 HIGH_TRUST）。①读者与引擎的独立性有实证而非假设：引擎读错而视觉给了数的 22 帧里视觉全部站人工真值（旧 8/8、新 18/19）、零例同错；视觉拒答面覆盖引擎问题帧的 75-86%——即 6% 的自动扫描把审查面从"全部"压到"这几十张"，这正是人工校对最贵的那一步（"看不出哪些数据有问题"）的替代。②更便宜的换型读者（deepseek-v4.1-flash 替 GLM-5.3-Flash）**可行但不可单独采信**：清晰视频仍 100%（1144/1144）、拒答率不变（6.4%→6.2%）、墙钟上限 413s→136s（更快确认），但报出 6 个静默错读（test5 3 个 / test.mp4 3 个，Δ2-10）——旧读者在同批帧上 0 错；单读会把 0.18% 的错误无声写进真值，**必须过"与引擎一致才放行"的闸门**（该闸门 100% 捕获这 6 例）。token 量两代相当（≈2.0M/3317 裁剪），故"更便宜"来自单价而非用量。③协议已固化为 tools/truth_build.py（sheets/plan/harvest/emit 四个确定性子命令；子代理只负责 Read 样张 + Write 每片一个 CSV），并把三条实测教训写成守卫：**解析宽容但不许静默丢行**（实测有读者把标签连 f 前缀写成 f03532,157；坏行若被当"拒答"计数则格式故障伪装成未知面）、**映射与读者的读序和标签无关**（实测列优先/行优先两种读序并存、帧号前缀会被漏抄 f01625→625，故按精确标签→唯一后缀→位置兜底三级对齐）、**计数语义不混**（视觉拒答 ≠ 引擎无读数 ≠ 错读）。④宿主行为取证：子代理定义在会话启动时快照（改 tools/ 后需重启会话才生效，重启前后探测实测 Read+RespondToCoordinator → Read/Write/Bash/RespondToCoordinator）；每个子代理的最终消息由宿主落盘在 %USERPROFILE%/.zcode/cli/agents/<sess>/<agentId>/output.txt，可作不依赖任何工具的第二收数通道（本轮用它逐行复核 3317 行手工转录，100.000% 一致）。⑤边界（不得外推）：全部取证仅一个赛车 HUD 的两个字体族、3 段真实视频、3 位数字域；"通用文字"场景未测；模糊区的"真值"本身是人工+插值产物（flag 11/12），故该处的不确定性是共享的而非视觉读者的缺陷'
