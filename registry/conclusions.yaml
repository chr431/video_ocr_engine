- id: C-97
  conclusion: '**真值数据格式自立：原生 truth.v1（JSONL，逐帧 state）+ RVTL 兼容 shim；RVTL 的头只作为"外部格式"经 shim 读写，其格式怪癖不得渗进工具与下游。** 触发原因是一次静默假失败：emit 的头部一度写成空格分隔，既有消费方（e2e_smoke --truth）读不到 frame_start，于是拿错的帧窗口去对齐，输出"匹配率 5.8% ✗"——真值没错、代码没错，错在把别人的日志行格式当成了自己的契约。①原生格式的本体是**逐帧 state**：read（K 次独立读一致得到的值）/ inferred（由连续性等先验补出）/ unknown（看不清或读数分歧）；C-95 已证明"读出来的"与"补出来的"混同会制造假真值（先例=test4_truth 的 12 个"混合段"），故 write 层强制：unknown 不得带值、inferred 必须写 source、state 非法即报错——不留模糊态。②RVTL shim 是**唯一**允许知道 RVTL 格式的模块：读侧容忍内联 roi/字段缺失/多余列/BOM，但缺 video/roi 必须报错（不许拿默认值蒙混）；写侧默认**拒绝**把 inferred 当读数导出（兼容层不得成为"制造读数"的出口），显式放行时须在头部记 inferred 计数。③列语义按列数判定——RVTL 原生行是 `frame,time,text,conf`（**值在第 3 列**），shim 自己的导出是 `frame,value`（第 2 列）；改写 shim 时曾把值取在第 2 列，guard 测试当场抓住：这类错不会报错，只会让真值集合静默变空或整体错位，正是"格式耦合"的典型受害面。④落地：tools/_truth_format.py（格式 + shim）、truth_build.py 改为只经 shim 读写 RVTL、emit 主产物为 truth.v1 JSONL 并可 `--rvlt` 镜像导出；对真实人工校对语料复跑读数与改前逐项一致（test5_ref 630/634、同 3 处错读）。⑤边界：原生格式目前只覆盖"每帧一个整数值 + state"；多字段 ROI（一格里多个数）或小数/时间码需扩展 value 类型并升 schema 位'
