- id: C-92
  conclusion: '**P0/P1 真机验证轮 + P2 三项：验证期发现并修复两个测量系统缺陷（GPU 门禁假红 / ab 红旗被早退跳过），P2-1 批量视图与 P2-2 标定账本落地，P2-3 实测确认旋钮真交互并据此建矩阵屏**。①GPU 负载门禁改为**窗口均值**：nvidia-smi 单点是瞬时量（30 点实测 min 8 / p50 21 / max 73），桌面合成爆发会把单点打成 50%+ 而任务管理器口径稳定 <25% —— 本轮三次单点 52/57/59% 假红即此因；改 5×0.5s 窗口均值后与任务管理器口径一致（实测 25%），且旧式"取最大"会把桌面爆发的尖峰当成持续负载（方向相反，已弃）。②health 红旗曾被热轮早退跳过：`ab` 里 `if not hot_diffs: continue` 在红旗检查**之前**，时钟门禁全剔（"无有效配对轮"）时正确性判据随之缺席——移到早退之前，`--no-verdict`/`--aa` 同样不豁免。③P2-1 多文件批量视图（`bench bulk`）：取证=跨文件墙钟散布中位 **106.6%**（h264 1.04 / av1 2.51 / hevc 3.57s @win3000）vs 同文件重复轮中位 **1.02%**，差 ~100× ⇒ 文件身份是方差主因子，聚合口径会把单文件回归整个吃掉；视图输出 per-file 热轮中位/散布 + **跨轮指纹一致性**（text_sha/段结构/段数任一不同即判确定性缺陷、退出码 1）+ 跨文件散布对照，且门禁全剔时如实标记（冷轮混入会把散布虚高到 88%，已在读数里标注）。④P2-2 A/A 标定账本（`bench/aa_calibration.jsonl`）：`ab --aa` 落"噪声带 + 机器指纹（GPU 名/驱动/核数）+ 建议阈值"，此后每次 `ab` 启动自动比对并在指纹不符（换机）/带显著变宽时告警、`--aa` 重标时与上一条比 drift（阈 = max(上次 SE, 本机地板)）；此前该纪律只在文档里、无执行体。⑤P2-3 多旋钮矩阵屏（`bench matrix`）由**实测交互**驱动而非预设框架：fill_width × force_aspect 2×2（本机 test5/win3000/5 对交错）实测差中差 **+5.35%（SE 1.42%，符号 5/5）**，两个方向的单因子效应符号相反（fa=0 时 fw224→0 为 −3.57%、fa=1.5 时 +1.79%）——**一阶逐项扫描在此对上必错**（结论依赖被固定的另一旋钮水平）。附带确证时钟门禁的适用边界：当被测旋钮本身改变 GPU 负载（fw=0 → OCR 更省 → GPU 更闲 → SM 时钟自然落 2070~2250 < 0.75×最大）时，门禁把**处理效应**误判为环境干扰并整臂剔除（A/B 退化为"无有效配对轮"）；此类对比须 `--no-clock-gate`，矩阵屏改以同轮交错对消漂移。⑥P2-1 批量形态下的确定性哨兵：`bulk` 的跨轮指纹一致性已在实跑中对两文件各 3 轮全同通过（498/611 段，text_sha 恒定）'
