- id: C-87
  conclusion: '**fork GetBatch 的 ROI 批装配此前是「物化」路径——每帧新分配一个临时宿主缓冲 + 一次额外拷贝，设备 yuv420 源更是每帧两次同步 cudaMemcpy2D D2H，因此 get_batch(roi) 反而慢于逐帧 next_roi（也慢于无 roi 的 get_batch）；ROI 直投修复后该税归零**。复现（同轮交错，3000 帧，全帧 yuv420，批 250，只 touch shape）：gpu/hevc 无roi 1.536s / roi 2.849s / next_roi 2.138s（roi 比无 roi 慢 85.4%、比 next_roi 慢 33.3%）；cpu/h264 2.027 / 2.468 / 2.520（+21.7%）；gpu/h264 3.333 / 3.455 / 3.296（+3.7%）；gpu/hevc gray 无差。机制：GetBatch 逐帧调 CropRoi，而 CropRoi 是物化接口（宿主 NDArray::Empty + 逐行 memcpy；设备 yuv420 走 CropRoiYuv420 的 D2H 分支），批装配随后把该临时缓冲再拷进批槽 ⇒ 每帧两遍拷贝 + 一次分配；设备源多一次 PCIe 往返，且同步 D2H 会逐帧把设备流水排干（解码越快越显形——h264 NVDEC 慢，故把税掩盖；hevc NVDEC 快，税全露）。next_roi 无此问题：直接返回帧/裁剪结果，ROI-first 灰度更是纯直通（零拷贝）。**C-84 的「CropRoi 直通前置」只修了灰度**——yuv420 分支在 CropRoi 里位于直通检查之前，从未被修。修复（fork 6d3b0bf）：ROI 直投——宿主源逐行 memcpy 直落批槽（无临时缓冲、无第二遍拷贝），设备源 cudaMemcpy2D D2D 异步（挂批装配专用流，不经宿主中转），源帧已是 ROI 形状则整流拷贝（等价原直通），几何异常退回原物化路径；判据/偏移/行距/行字节数与 CropRoi 逐字节一致。配套：cudart_shim 的 cudaMemcpy2D 原本只实现 host↔device 两向（其余 kind 落 D2H 分支 = 把设备指针当宿主指针，D2D 调用会崩/产垃圾），补四向 cudaMemcpy2DAsync + nv_gpu_dyn 注册 cuMemcpy2DAsync_v2。实测修复后（同轮）：crop 税 +85.4%→+0.0%、+21.7%→+2.2%、+3.7%→+0.0%；全帧 yuv420 下 get_batch(roi) 反超 next_roi 20~27%（hevc 1.536 vs 2.113）。**引擎口径中性（重要）**：引擎 ROI 108x32 下 get_batch(roi) 与 next_roi 本就相等（±0.7%，修复前后同），解码主导把 3.5KB/帧的税掩盖（该税量级 ~1-2µs/帧 = 0.3-0.6%，在噪声下）——本修复对引擎现状零收益，价值在三处：① fork 公开 API 面：get_batch(roi=) 在非平凡 ROI 下不再慢于自身无 roi 变体、也不再慢于逐帧 next_roi（此前全帧 hevc yuv420 慢 85%/33%）；② ROI 放大（全宽/上下文 ROI）或引擎改逐帧指针消费（pointer-table 内核）时的前置；③ 消除设备 yuv420 批路径的逐帧同步点（潜性成本，引擎 keep_crops+rep_crop_format=yuv 的 nvdec/hybrid 路径正是该分支）。注：fork README 性能表的协议是 get_batch **不设 roi**（bench_decode_only 默认 roi=None），不经过 CropRoi，故本修复不影响该表数字'
