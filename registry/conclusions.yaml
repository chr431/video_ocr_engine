- id: C-96
  conclusion: '**盲读第二次独立读的收益与上限：投票+闸门把自动放行面的错读压到 1/4，但**压不到 0**——残余是"所有读者共谋"的系统性盲点（两读一致 ∧ 引擎一致 ∧ 三者同错）。**setB+setC 共 2172 帧、同模型两次独立盲读：单读错读第 1 次 25（1.15%）/ 第 2 次 36（1.66%）——单读口径本身不稳定（同一协议同模型，两遍差 44%），所以任何"单读=可信真值"的说法都不成立。第 1 次错读的去向：第 2 次纠正 9、**同样错 11**、改错别的 2、拒答 3 ⇒ **约 44% 的盲读错读跨读复现**（像素决定的系统性盲点，非随机抖动）。两读一致面覆盖 94.11%，其中错 11（0.538%）；再叠加"与引擎一致"后：**放行 93.51%、残余错 6（0.295%）、审查面 6.49%**——即闸门栈把放行面错误率从 1.15% 压到 0.295%（约 1/4），代价是读两遍 + 6.5% 人审面。①残余 6 帧（798/1520/2138/2802/2921/3006）的形态一致：均为数字被部分遮挡/过曝，例如 100 vs 180、101 vs 103、190 vs 198——**两读与引擎都在同一块残缺像素上收敛到同一个错值**；这类错无法用"加读者/加投票"消除，只能靠更换观看条件（放大/多帧/换 ROI）或人工。②分视频：扁字体 test5 两读一致 97%、一致面错 0、闸门放行 96.85% 错 0（该档已可用）；模糊 test.mp4 是全部残余的来源（放行面 6 错 / 审查面 7.87%）。③设计结论（已落进工具）：闸门是**必要性叠加**——盲读直读面 → K 次独立读一致 → 与引擎一致 → 残余人审；**多读分歧不得投票取值**（分歧值本身无依据，只能记未知），这条已写成 emit 的行为与负测。④协议已按诚实口径设默认并对新素材可用：tools/truth_build.py 的 sheets 默认盲读（全局乱序 + 只标乱序 id，key.json 明令不入调度面），harvest 支持多 --run 出闸门栈，emit 只在多读一致时取值、分歧记未知、并写出 Race 兼容头（video/roi/frame_start/frame_end）以便被 e2e_smoke --truth 直接消费；新视频无真值时可用 --video/--roi/--frame-start/--frame-end 起链（已实测跑通：smoke 用例 emit 的值与人工校对真值在对应帧一致）。guard 由 12 测扩到 16 测（新增盲读 id→帧映射、闸门栈可失败、分歧不得投票）'
