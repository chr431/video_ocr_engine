  conclusion: '**GPU lane 对宿主 lane 的亏损是五项可消除的结构性开销之和，修复后零拷贝兑现为实测领先**（nvdec+TRT，4 视频 3-4 对交错 A/B，段数逐位一致）：test6_h264 宿主/GPU=1.046、hevc=1.054、av1=1.067（GPU lane 快 4.6-6.7%），test5 h264=0.993（持平；C-83 基线时四码 0.938-0.983 即宿主全胜）。损耗模型（逐项实测分解，3000 帧 ROI 106×33）：① 消费端逐断段边界的 sim_pair「launch+D2H+流同步」~千次（span 0.122s）；② analyzer 冷构造 0.43s/进程（cuda.core 导入 0.233+首次 Device 0.093+模块导入 0.107）全落校准相位；③ fork GetBatch 设备路径逐帧 D2H→H2D 往返（CropRoi 的 D2H 在 ROI 直通检查之前）+ 逐帧同步 CopyTo + 每批 cudaMalloc/Free（cudaFree=隐式设备级同步）；④ 校准首拉含解码器冷启动，与 analyzer 等待串行；⑤ 逐帧生产者队列（3000 次锁往返）。「decode.batch +240ms」是相位记账假象——宿主 lane 批间思考时间（灰度/win3 0.26s）不计入 span 而设备 lane 批大摊薄少；两 lane 解码周期实测同为 1.02ms/帧。修复五件套（帧数据全程显存驻留，跨 PCIe 的只有每批 KB 级标量）：① BoundaryPairPlanner（SegmentStateMachine 的 merge 无关投影：边界=cluster≥C、代表帧=sharp 严格最大保先者，均不依赖合并决策）生产者侧产出相邻段代表帧对 + sim_pair_multi 多对内核一次 launch 拼车 D2H，消费端 similar() 缓存命中→宿主标量判定零 GPU 交互、未命中（合并链使提问对更旧）→原同步路径兜底（同内核同指针逐位相同；镜像性质测试：全 emit 下提问集逐对一致、合并下代表帧几何一致）；② analyzer 预热线程从 run 入口启动 + 校准批拉流与预热等待重叠；③ 拉流预读线程（校准期即启动的唯一 get_batch 调用者，深 GPU_PIPELINE_PULL_DEPTH=6 批）——解码器领先消费端，analyzer 等待/解码冷启动全部与真实解码重叠；④ fork 三件套（4a959f8：CropRoi 直通前置、设备批装配异步 D2D+持有窗 16<池深 22、批缓冲池扩到设备）；⑤ 帧流内联消费 + 批列表传递。等效性：金标 33/33 逐位一致（含 stride8——校准段帧号须按 frames[k] 编号，主批维持既有 k0+k 口径）、C-62 窗阵 ALL PASS×5。GPU_PIPELINE_STREAM/DRAINER 两旋钮随变体路径移除（预读从校准期启动即为其零收益（C-10）的根因修复）。yuv 分支（keep_crops+rep_crop_format=yuv）gray 驻留在单块 _luma_dev 被逐批覆盖→不投机保持原路径。test5 持平机制：解码最慢（~1000fps 占墙钟 90%），固定开销占比最小且 GPU lane 的 OCR 侧优势（设备预处理 0.02s vs 宿主 0.21s）被解码完全重叠；解码越快 OCR 越接近共临界路径，设备侧优势越落墙钟'
