  conclusion: '**fork 侧性能优化空间已用测量穷尽关闭：三条硬顶=NVDEC 硬件解码率、FFmpeg 32 线程软解率、两臂速率和；本轮两项候选实测均为负结果（已撤销），C-87/88/89 后热路径无可测增益项**。①延迟 unmap 探测化（解析线程每帧 FlushDeferred 的全流同步 → cudaEventQuery + 有界 pending，撤销前实测）：cap=6 时 NVCUVID 并发映射数触硬限（cuvidMapVideoFrame64 返回 205，map 失败），cap=2 可跑但三码 solo 交付零变化（918/2031/1686 vs 916/2028/1683）——**证伪「解析线程同步是 busy-交付差值本体」假设**；该差值即 NVDEC 硬件解码率（h264 916 / hevc 2028 / av1 1683 全片稳定，与 NVIDIA 1080p 各码比率吻合，全帧与 ROI 同值=转换内核大小无关）。已整体撤销（无增益不落地复杂度+映射数陷阱；cudaEventQuery 垫片扩展一并回退）。②转换扇出池（DECORD_CONVERT_WORKERS=2/4，cpu 全帧 yuv420）：h264 1940/1784 vs 基线 1951（负）、hevc 持平、av1 1095/1062 vs 1097（4 worker 负 3%）——EmitOrdered 持 reorder_mu_ 睡背压把全部 worker 串行化（审计 A9/B6 所指），fan-out 结构性无收益，维持默认关。③复核确认 fork hybrid(0) 交付=臂率和理想（h264 6.35 vs 臂临界 6.31s；hevc/av1 的 GPU 臂在臂内≈solo 上限 −1~5%），in-hybrid GPU 臂交付与 solo 差 ≤5%（合并/发射税已压平）。**剩余清单全部为 µs 级或冷路径**（审计 C2/C3 每帧锁批量化：供给已在理想故不落墙钟；C9/B11 seek churn：引擎每 run ~1 次 seek；C5 批量收割：每帧一次零等待驱动调用；A6 池余量：抖动向非速率向）。**hybrid 距理论的最后杠杆在引擎侧头尾（C-89 revisit 已记：pre-run 0.276 + 尾部 0.445s），与 fork 无关**'
