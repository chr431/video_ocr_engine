  conclusion: '**合成视频路线取消（裁决）：测试真值改由 C-93 的「异源视觉读者 + 一致面放行」获取，不再走"生成视频 + 构造已知真值"**。取消依据不是试点失败——试点恰恰证明生成视频可用（PIL 逐帧渲染 + ffmpeg 三码编码 → 引擎抽取：OCR 100% 可读、三码 × 三解码后端全通、编码与抽取可复现、24000 帧 h264 生成 147s/3.0MB），而是**成本结构**：合成只买到"真值已知"，而真实视频的同一目的已由视觉读者达到，且后者连带解决"每加一个用例都要人工校对真值"这个真实痛点（C-93）——为买到的第二个性质付一套新资产的维护费不划算。保留的技术阻断项（重启该路线前必须先知道）：①HEVC 必须 `-x265-params open-gop=0`——libx265 默认 open-GOP 产生 CRA（nal_type 21），而真实 test6_hevc 是 IDR（19），fork hybrid 在批 ≥249 时挂死（已定位并复现）；②yuv420p 要偶数边长（按 0.33 缩放会得到 633 奇数宽，须显式取偶）；③被中断的半成品 mp4 会静默给出 69.2% 的"全码率失败"读数，重测前必须重建；④合成视频的独有价值只剩"真实素材中不存在的条件"（未拍到的编码/分辨率/宽高比/空白帧/损坏区），而这类条件大多可由"真实视频重编码"覆盖——重编码后仍可用视觉读者取真值，故合成图像本身多半仍非必需。残留物（全在忽略域内，可随时删，需要时重建为分钟级）：_scratch/gen/（56 个生成 mp4，12MB）、gen_video_pilot.py、gen_video_pilot2.py、pilot*.log'
