# 权威性能数字（S0 基线 + S6 轮，2026-09-10；机器：7945HX + RTX 4060 Laptop
# 8GB，driver 610.88，decord fork 0.8.2，TRT sm89；3000 帧窗口热轮中位）
# 事实源：S0 = tests/golden/bench_baseline.json；S6 起 = bench/registry.jsonl
# （append-only RunReport）。本表为人工确认的权威口径。
- metric: e2e_wall_3000
  h264-gpu-nvdec-trt: 3.107
  h264-cpu-cpu-trt: 1.131
  hevc-nvdec-trt: 1.528
  av1-nvdec-trt: 1.814
  noise_floor_warm_pct: 1.3
- metric: decode_ceiling_fps
  h264_nvdec: 1013
  h264_cpu: 3300
  hevc_nvdec: 2127
  av1_nvdec: 1780
- metric: host_gpu_equivalence
  window: [0, 2000]
  segments: bitwise
  texts: bitwise
  conf_median_delta: 0.0
  conf_worst_delta: 0.00454
# ── S6 轮（交错 A/B：A/B/A/B 独立子进程 + 逐对符号一致性）──────────────
- metric: s6_measurement_env
  same_code_two_runs_delta_pct: 7.7    # 同码连跑两次最大散布 → A/B 必须交错
  gpu_thermal_slowdown_cumulative_s: 87.7
  method: tools/bench.py ab
- metric: s6_telemetry_overhead_pct    # PI-15（3000 帧；交错 5 轮 × 每档热轮 2 次）
  off_s: 3.1260
  std_s: 3.1296
  std_vs_off_pct: 0.115
  full_vs_off_pct: 0.038
  verdict: std≈full（full<std 证明残差在噪声内）；0.1% 阈值低于本机分辨力（±0.1%）
- metric: s6_trt_profile_batch         # S6-g′：TRT profile batch 6→18
  micro_1116img_b6_s: 0.663
  micro_1116img_b18_s: 0.557
  micro_delta_pct: -16.0
  e2e_h264cpu_hot_delta_pct: -5.85      # 交错 3 对，符号 3/3
  e2e_ocr_infer_delta_pct: -33
  sub_chunks: 181 -> 61
  texts: bitwise                        # 段结构/文本 sha 逐位不变；置信度第 4 位漂移
  engine_build_first_run_s: 68
- metric: s6_coldstart_3000            # h264-cpu 冷/热相位
  cold_wall_s: 1.799
  hot_wall_s: 1.215
  cold_engine_init_s: 0.410
  cold_calibrate_s: 0.501            # 含 NVRTC 首编 0.4s（cubin 缓存后 0.09s）
  cuda_core_import_s: 0.224
  trt_deserialize_s: 0.39
- metric: s6_warmup_1500               # 显式预热（h264-cpu）
  warmup_s: 0.500
  first_extract_after_warmup_s: 0.798
  engine_init_after_warmup_s: 0.00007
  first_video_delta_pct: -33
- metric: s6_consumer_submission       # 交错 A/B 冷启动（各 3 对）
  reduce_d2h_sync_to_async_h264cpu_pct: -5.19
  keep_crops_d2h_batched_h264gpu_pct: -2.45
  pi14_gpu_ctc_bitwise: pass
- metric: s6_nv12_lut                 # S6-f′：宿主路径 Y 展开 LUT（逐位等价）
  host_path_3000f_yuv_decode_luma_batch_s: 0.090 -> 0.052
  phase_delta_pct: -42
  wall_3000f_s: 1.168 -> 1.135
  bitwise: pass                       # 256 值全枚举 + 批量/单帧/full-range
- metric: s6_ocr_fill
  fill_pct: 40.2
  pad_cols: 224
  content_cols_avg: 90
  pad_224_to_320_hot_pct: 3.66
- metric: s6_reorder_window_3000       # 交错 A/B 4 对，符号 4/4 一致
  rw1_vs_rw64_hot_pct: -5.05
  rw1_vs_rw256_hot_pct: -11.16
  adaptive_rule: roi_aspect <= floor/OCR_TARGET_H -> window=1
# ── hybrid 差距分解（S6 续轮，2026-09-11；详见 docs/log/2026-09-11-hybrid差距分解.md）──
- metric: hybrid_decode_capability      # 纯解码 fps（ROI/gray/批 64/3000 帧，fork dll）
  h264: {cpu: 3573, nvdec: 983, hybrid_host: 3783, hybrid_gpu: 3052, ideal_parallel_sum: 4556}
  hevc: {cpu: 754, nvdec: 2036, hybrid_host: 1833, hybrid_gpu: 2116, ideal_parallel_sum: 2790}
  av1:  {cpu: 1112, nvdec: 1694, hybrid_host: 2686, hybrid_gpu: 2174, ideal_parallel_sum: 2806}
- metric: hybrid_engine_gap_pct          # 引擎吃掉多少（L1 hybrid_gpu → L3 热轮墙钟）
  h264: 18
  hevc: 10-27
  av1: 0
- metric: hybrid_routing_3000            # 出厂 dll 实测最优路由（引擎热轮中位 s）
  h264: {best: cpu, best_s: 0.994, hybrid_s: 1.384, nvdec_s: 3.107}
  hevc: {best: nvdec, best_s: 1.528, hybrid_s: 1.577, cpu_s: 4.249}
  av1:  {best: hybrid, best_s: 1.372, nvdec_s: 1.818, cpu_s: 2.898}
  auto_policy: NVDEC 优先（C-08 用户决策，未改）
- metric: fork_dll_unpublished_value   # DECORD_LIBRARY_PATH=build-081fix vs stock 0.8.2
  h264_hybrid_engine_pct: -12.73
  av1_hybrid_engine_pct: -11.19
  h264_hybrid_gpu_decode_pct: 8.2
  hevc_hybrid_gpu_decode_pct: -8.4      # fork 回退：发布前需复核 hevc
- metric: hybrid_cpu_threads_policy     # 交错 A/B（3000 帧热轮）
  shipped_12_to_16_h264_pct: -6.49
  shipped_12_to_16_hevc_pct: -12.72
  fork_12_to_16_h264_pct: -3.91
  new_default: cores//2 clamped [8,16]
- metric: hybrid_engine_loss_refuted    # 引擎侧损耗的两条否定结果（别重复试）
  buffer_size_128_to_512_h264_pct: 0.51
  buffer_size_128_to_512_hevc_pct: 2.00
  gpu_pipeline_stream_0_to_1_h264_pct: 0.71
  verdict: 队列/预取均无收益；剩余候选=CPU 争用（待线程时间线剖析）
# ── §8.6 r5 资源层首批真读数（L1 差分 / L2 NVML，2026-09-11）──────────────
- metric: resource_layer_call_cost      # 单次采样成本实测（本机 Windows）
  time_process_time_us: 0.05
  kernel32_io_counters_us: 2.5
  psapi_memory_info_us: 4.6
  cudaMemGetInfo_us: 0.9
  nvml_GetUtilizationRates_us: 0.3
  nvml_GetMemoryInfo_us: 1.7
  nvml_GetDecoderUtilization_us: 0.5
  banned_psutil_threads_ms: 43.0        # 地雷：一次就吃满 PI-15 预算
  banned_psutil_num_threads_ms: 5.1
  l1_checkpoint_total_us: 10            # 每 run 仅 4 个边界 ≈ 40µs
- metric: per_phase_cores_h264cpu_3000  # h264-cpu（TRT OCR），热轮差分
  calibrate: {wall_s: 0.065, cores_avg: 9.18, threads: 4, rss_delta_mib: 267.4, disk_read_mbps: 967.2}
  decode:    {wall_s: 0.953, cores_avg: 21.21, threads: 4, rss_delta_mib: 71.5, disk_read_mbps: 108.6, vram_used_mib: 1667.5}
  ocr_tail:  {wall_s: 0.068, cores_avg: 7.38, threads: 2, rss_delta_mib: -349.9}
  reading: CPU 软解相位实测用到 ~21/32 逻辑核 → hybrid 的 CPU 分片必与引擎线程争核
- metric: nvml_sanity_check             # 探针不可自嗨：CPU 软解配置下 NVDEC 必须读 0
  config: h264-cpu
  nvdec_util_pct: {min: 0, p50: 0, max: 0}
  gpu_util_pct: {min: 7, p50: 7, max: 34}
- metric: pi15_gate_calibration          # 门禁阈值按本机 A/A 现测标定（r11 用户授权放松）
  bad_estimator_same_code_two_reads_pct: [-0.504, 0.930]   # 旧判据：三档各自中位相减
  fixed_order_full_delta_pct: 3.32       # 位置效应：每轮先跑的档系统性偏慢
  subproc_aa_pct: {p50abs: 0.24, p95abs: 2.33, maxabs: 3.98}   # 子进程模式噪声
  inproc_aa_25pairs_inner3_pct: {mean: -0.179, median: -0.365, sd: 1.053, se: 0.211,
                                 p95abs: 1.811, maxabs: 2.597}
  rule: limit = ceil_0.05(|A/A 均值偏差| + 3×SE), floor 0.30%
  calibrated_limits_pct: {std: 0.85, full: 0.85}
  statistic: 配对差分**均值**（轮转后差值 ±X 双峰，中位数落在峰上→失效）
  sign_majority: 0.70
- metric: pi15_final_verdict_quiet      # 独占机器复测（25 对 × inner 3，h264-cpu/3000）
  off_s: 1.2106
  std_s: 1.2096
  full_s: 1.2053
  std_vs_off_pct: 0.029
  std_se_pct: 0.291
  full_vs_off_pct: 0.140
  full_se_pct: 0.257
  signs: {std: 13/25, full: 13/25}
  verdict: 通过（点估计其实优于原设计目标 +0.1%/+1%，但 SE 0.29% 不足以证明）
- metric: telemetry_cost_guard          # 严格性搬到的确定性守卫（µs 级分辨力）
  real_run_records: {span_keys: 9, span_samples: 138, counter_keys: 10, gauge_keys: 8, checkpoints: 4}
  std_full_path_budget_ms_per_run: 2.0
  off_tier_records_cost_ms_per_run: 0.012
  report_assembly_ms: {samples_138: 0.107, samples_552: 0.078, samples_2760: 0.072}
  note: 组装成本与样本数无关（drain 一次合并）；99ms 那种数字是 environment() 首调
- metric: gpu_fingerprint_source        # 环境指纹改走 NVML（进程级缓存，落在报告路径上）
  nvidia_smi_subprocess_ms: 43.1
  nvml_first_call_ms: 20.8
  nvml_calls_us: {GetUtilizationRates: 0.3, GetMemoryInfo: 1.7, GetDecoderUtilization: 0.5}
  fallback: nvidia-smi（记 gpu_source=nvidia-smi；两者皆失败记 unavailable）
# ── hybrid 混跑损耗（fork 死锁修复后才可测；2026-09-11，600 帧/臂）──────────
- metric: hybrid_mixing_loss_fps        # FORCE_SIDE 三臂（短窗含暖机，看相对量）
  h264: {gpu_arm: 920, cpu_arm: 2200, mixed: 1588, ideal_sum: 3120}
  hevc: {gpu_arm: 1976, cpu_arm: 898, mixed: 1334, ideal_sum: 2874}
  mixed_vs_best_single_pct: {h264: -28, hevc: -32}
  reading: 混跑相对**最优单侧**是净亏损（与"hybrid_gpu 仅达理想 67–77%"是两笔账）
  first_suspect: 队头阻塞——发射按 chunk 严格保序，chunk 边界=关键帧（GOP≈299 帧）
  fork_bug_fixed: 99b8785（bootstrap/BuildPlan 绕过 FORCE_SIDE → force=cpu 死锁，
                    实测 637 帧 CPU 存货卡在一个永不落地的 GPU chunk 后面）
  unforced_recheck_fps_2000: {before: [2980, 2994, 3071], after: [2833, 3077, 3041]}
  golden_with_fork_dll: 28/28 逐位一致
# ── CPU 速率估计器"排空棘轮"缺陷 + sustained 修正（§7.2-1 先量后做）────────
- metric: hybrid_cpu_rate_ratchet         # 非打印 DECORD_CPU_RATE_DEBUG trace 锤实
  hevc_hybrid_fps: {ewma: 1951, sustained: 2688}   # decode-only 3000f×3 中位
  h264_hybrid_fps: {ewma: 3537, sustained: 3167}   # sustained 略降但 h264 走显式 cpu
  av1_hybrid_fps: {ewma: 2645, sustained: 2580}    # ≈持平（噪声内）
  root_cause: 容量 EWMA（升1.3x/降5%）被**解码器预跑存货排空孤峰**逐发棘轮
  trace_evidence: hevc 真产率 r≈630-900 但 r=2491..9138 孤峰每~15折一发，
                  EWMA 永久卡 1200-2500（纯 nvdec 单臂仅 2036）
  consequence: BuildPlan 冻结高估 rc → hevc CPU 份额翻 2-3x → 混跑 1568 < nvdec 2036
  sustained_fix: 滑窗8折内连续4折最小值的最大值 + 0.997/折慢降锁
  key_correction: sustained 下 hevc hybrid 2688-2778 **> 纯 nvdec 2036**，达并行
                  理想(2790) 的 96-99% → §7.1 "混跑净亏损"很大程度是估计器伪影
  gpu_out_deadlock: hybrid_gpu（引擎 GPU 管线口径）真实倾斜计划暴露先存在死锁
                    ~2/8 挂死（EWMA 对照 16/16 干净）→ sustained 暂 opt-in
                    DECORD_CPU_RATE_SUSTAINED=1，默认仍 EWMA（金标 28/28）
  fork_commit: 75b8602

