  host_ctx: hybrid(宿主) 三码全片 +9~27%：h264 3135→3975（达成 69%→87%）、
            hevc 2498→2897、av1 2445→2670（→95%）；hevc 全片超 3000f 理想分母
            （单臂短窗口径低估长跑，非超并行理想）
  gpu_ctx: hybrid_gpu 分化——hevc +7.8%（→103%）；h264 零摊薄（68% 持平）；
           **av1 回退 6.4%**（2462→2304，88%→82%）
  av1_regression_mechanism: sustained rc 长片塌到 702（单臂真值 1112 的 63%）
           → 计划 78% 倾斜 GPU → g-head strand 17884 / HOL 6.52s；引擎级未显形
