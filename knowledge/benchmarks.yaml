                    DECORD_CPU_RATE_SUSTAINED=1，默认仍 EWMA（金标 28/28）
  fork_commit: 75b8602
# ── 2026-09-12 后续：kick 突发治死锁 + sustained 转默认（fork 4ccf889）──────
- metric: hybrid_sustained_default          # 死锁根因 = open-GOP DPB 扣 IDR+leading
  deadlock_root_cause: 跨侧切换后离场侧等不到后续包，kick 单 IDR 冲不开 open-GOP
                       DPB（挂死现场扣 6 帧 = IDR+5 leading，side_pending=6 吻合）
                       → 瞬态滞留变永久冻结 → 队头缺帧/盲窗被对侧库存吃满
  fix: 跨侧切换后新 chunk 前 KICK_BURST=5 包克隆喂离场侧（越界 stash/陈旧
       丢弃兜底）；DECORD_HYBRID_KICK_BURST=0 可消融回单包 kick
  stress: 引擎 GPU 管线全片判别：DECORD_HYBRID_KICK_BURST=0 → hevc 4/4 挂死，
          =5 数十次运行零挂死（金标 28/28 含 hybrid）。⚠️ 纯 VideoReader 慢
          消费者 harness（3000f 与全片）复现不了该死锁（kick=0 也干净）——
          §8.2"复现配方（无需引擎）"记载有误，判别必须走引擎
  gate_off: sustained 转默认 + DECORD_CPU_RATE_SUSTAINED env 删除（双轨期结束）
  e2e_full_video: # 引擎 GPU 管线全片 e2e，配对 3 遍，段数逐位一致（_probe_e2e_mode）
    hevc: {ewma_s: 12.73, sustained_s: 9.66, delta: "-24%，3/3"}
    hevc_vs_nvdec: {nvdec_s: 12.44, hybrid_s: 9.60, delta: "-23%，2/2 —— hevc
                    hybrid 首次显著转正（旧口径 ≈ 最优单侧 ±3-5%）"}
    h264: {ewma_s: 3.30, sustained_s: 3.15, delta: "-4.7%，3/3"}
    av1: {delta: "持平（±1% 漂移内）"}
  decode_only: hevc hybrid 2498 / hybrid_gpu 2659 fps（并行理想 2790 的 90-95%）
  golden_with_fork_dll: 28/28 逐位一致
  leftover: 上传批次碎裂已定性为**无害**（见下条 kUploadBatch A/B）
  fork_commit: 4ccf889
  dev_dll_md5: 52a10789
