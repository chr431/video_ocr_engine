# 权威性能数字（S0 基线 + S6 轮，2026-09-10；机器：7945HX + RTX 4060 Laptop
# 8GB，driver 610.88，decord fork 0.8.2，TRT sm89；3000 帧窗口热轮中位）
# 事实源：S0 = tests/golden/bench_baseline.json；S6 起 = bench/registry.jsonl
# （append-only RunReport）。本表为人工确认的权威口径。
- metric: e2e_wall_3000
  h264-gpu-nvdec-trt: 3.107
  h264-cpu-cpu-trt: 1.131
  hevc-nvdec-trt: 1.528
  av1-nvdec-trt: 1.814
  noise_floor_warm_pct: 1.3
- metric: decode_ceiling_fps
  h264_nvdec: 1013
  h264_cpu: 3300
  hevc_nvdec: 2127
  av1_nvdec: 1780
- metric: host_gpu_equivalence
  window: [0, 2000]
  segments: bitwise
  texts: bitwise
  conf_median_delta: 0.0
  conf_worst_delta: 0.00454
# ── S6 轮（交错 A/B：A/B/A/B 独立子进程 + 逐对符号一致性）──────────────
- metric: s6_measurement_env
  same_code_two_runs_delta_pct: 7.7    # 同码连跑两次最大散布 → A/B 必须交错
  gpu_thermal_slowdown_cumulative_s: 87.7
  method: tools/bench.py ab
- metric: s6_telemetry_overhead_pct    # PI-15（3000 帧；交错 5 轮 × 每档热轮 2 次）
  off_s: 3.1260
  std_s: 3.1296
  std_vs_off_pct: 0.115
  full_vs_off_pct: 0.038
  verdict: std≈full（full<std 证明残差在噪声内）；0.1% 阈值低于本机分辨力（±0.1%）
- metric: s6_trt_profile_batch         # S6-g′：TRT profile batch 6→18
  micro_1116img_b6_s: 0.663
  micro_1116img_b18_s: 0.557
  micro_delta_pct: -16.0
  e2e_h264cpu_hot_delta_pct: -5.85      # 交错 3 对，符号 3/3
  e2e_ocr_infer_delta_pct: -33
  sub_chunks: 181 -> 61
  texts: bitwise                        # 段结构/文本 sha 逐位不变；置信度第 4 位漂移
  engine_build_first_run_s: 68
- metric: s6_coldstart_3000            # h264-cpu 冷/热相位
  cold_wall_s: 1.799
  hot_wall_s: 1.215
  cold_engine_init_s: 0.410
  cold_calibrate_s: 0.501            # 含 NVRTC 首编 0.4s（cubin 缓存后 0.09s）
  cuda_core_import_s: 0.224
  trt_deserialize_s: 0.39
- metric: s6_warmup_1500               # 显式预热（h264-cpu）
  warmup_s: 0.500
  first_extract_after_warmup_s: 0.798
  engine_init_after_warmup_s: 0.00007
  first_video_delta_pct: -33
- metric: s6_consumer_submission       # 交错 A/B 冷启动（各 3 对）
  reduce_d2h_sync_to_async_h264cpu_pct: -5.19
  keep_crops_d2h_batched_h264gpu_pct: -2.45
  pi14_gpu_ctc_bitwise: pass
- metric: s6_nv12_lut                 # S6-f′：宿主路径 Y 展开 LUT（逐位等价）
  host_path_3000f_yuv_decode_luma_batch_s: 0.090 -> 0.052
  phase_delta_pct: -42
  wall_3000f_s: 1.168 -> 1.135
  bitwise: pass                       # 256 值全枚举 + 批量/单帧/full-range
- metric: s6_ocr_fill
  fill_pct: 40.2
  pad_cols: 224
  content_cols_avg: 90
  pad_224_to_320_hot_pct: 3.66
- metric: s6_reorder_window_3000       # 交错 A/B 4 对，符号 4/4 一致
  rw1_vs_rw64_hot_pct: -5.05
  rw1_vs_rw256_hot_pct: -11.16
  adaptive_rule: roi_aspect <= floor/OCR_TARGET_H -> window=1

