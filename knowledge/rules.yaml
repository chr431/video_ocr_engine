# 注入核规则（§8.7 L4 兜底层——每条声明执行机制；prose 须附"为何不能下移"）
# 事实源；AGENTS.md 为渲染入口（S8 起由本表核对）。
- rule: 数值不重排——重构不改任何算法数值/阈值语义，行为变更走 §10.2+金标重录
  mechanism: prose
  why: 算法意图无法机器执行；其守卫是金标 --verify（ci 层），本条只留方向性提醒
- rule: 金标漂移即回退——tests/golden --verify 失败的提交不许合入
  mechanism: ci
- rule: 改动后跑三个门禁——pytest 全绿 + 双审计 0 + 金标 --verify 28/28
  mechanism: hook
- rule: 录金标/跑 A/B 用既有脚本（record.py / bench.py），不自写对照探针
  mechanism: script
- rule: 性能 A/B 必须交错测量——同码连跑两次可差 7.7%（GPU 热降），顺序 A/B 会把漂移记到 B 头上
  mechanism: script
  # 执行体 = tools/bench.py ab（独立子进程 + 逐对符号一致性 + 冷却）
- rule: 门禁阈值必须 ≥ 本机可分辨下限——先 A/A 标定（同配置两槽），阈值=|均值偏差|+3×SE；低于分辨力的阈值只生产误报，µs 级严格性交给确定性成本守卫
  mechanism: script
  # 执行体 = tools/bench.py telemetry-check --aa；判据=同轮配对差分的**均值**+符号多数一致（位置效应靠轮转对消；双峰分布下中位数失效、均值有效）
  # 严格守卫 = tests/config/test_telemetry_cost.py（量插桩路径本身，分辨力高墙钟 ~10⁴ 倍）
- rule: 新增静默吞噬需行内注释豁免（audit 判据）；清理路径须 logger.debug
  mechanism: ci
- rule: 旋钮进 config/ 注册表（未注册名不得读取）；默认值依据带锚点
  mechanism: ci
- rule: 历史文档（docs/log 大档案）append-only——不注入、不做活性检查、不回写
  mechanism: ci
- rule: 压测/复现的子进程必须带硬超时且进度逐行落文件（管道吞 stdout 会把挂死伪装成在跑）——同款坑三次：孤儿 worker 烧 735s、无界压测烧 1543s
  mechanism: script
  # 执行体 = tools/_probe_stress_harness.py（trial 级子进程 + --timeout + 行缓冲日志）；新压测按此规格写，不许裸循环
- rule: 测试不依赖真实视频/GPU 时必须可离线跑；依赖者带 skip 守卫或 -m gpu
  mechanism: ci
