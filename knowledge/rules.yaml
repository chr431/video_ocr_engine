# 注入核规则（§8.7 L4 兜底层——每条声明执行机制；prose 须附"为何不能下移"）
# 事实源；AGENTS.md 为渲染入口（S8 起由本表核对）。
- rule: 数值不重排——重构不改任何算法数值/阈值语义，行为变更走 §10.2+金标重录
  mechanism: prose
  why: 算法意图无法机器执行；其守卫是金标 --verify（ci 层），本条只留方向性提醒
- rule: 金标漂移即回退——tests/golden --verify 失败的提交不许合入
  mechanism: ci
- rule: 改动后跑三个门禁——pytest 全绿 + 双审计 0 + 金标 --verify 28/28
  mechanism: hook
- rule: 录金标/跑 A/B 用既有脚本（record.py / bench.py），不自写对照探针
  mechanism: script
- rule: 性能 A/B 必须交错测量——同码连跑两次可差 7.7%（GPU 热降），顺序 A/B 会把漂移记到 B 头上
  mechanism: script
  # 执行体 = tools/bench.py ab（独立子进程 + 臂序逐对轮转 AB/BA + GPU 时钟门禁 sm_min≥0.75×最大SM
  #   + 冷/热轮分离 + 逐对符号 + 自动判定；阈值按同配置 ab --aa 标定，2026-09-17 起 GPU 0.40~0.55% / CPU 1.45% 级；
  #   冷启动判定用 --hard-cold（先 --aa 取冷带建议值，GPU 3.4%/CPU 3.95% 级）——热判定看不见冷启退化（C-50 实证）。
  #   归因表 = 逐对配对差分（对序号×轮号配对）：|均值|>3×SE ∧ 符号多数 标 **；只归因不判失败（C-42），需 --repeat ≥6）
  # ⚠️ hybrid 评估口径（C-53，2026-09-17 用户纠正）：对照臂 = **目标编码的最快纯解码臂**
  #   （h264→cpu ~2000fps 非 nvdec ~990；hevc/av1→nvdec）——错基线曾把 h264 判成 −46.5%（实为 +53.6% 慢）。
  #   且窗口须越过该码的 C-40 交叉点（hevc ≥全片；h264 任意）。标定/实验期间机器独占，后台任务禁止并行。
- rule: 门禁阈值必须 ≥ 本机可分辨下限——先 A/A 标定（同配置两槽），阈值=|均值偏差|+3×SE；低于分辨力的阈值只生产误报，µs 级严格性交给确定性成本守卫
  mechanism: script
  # 执行体 = tools/bench.py telemetry-check --aa；判据=同轮配对差分的**均值**+符号多数一致（位置效应靠轮转对消；双峰分布下中位数失效、均值有效）
  # 严格守卫 = tests/config/test_telemetry_cost.py（量插桩路径本身，分辨力高墙钟 ~10⁴ 倍）
- rule: 新增静默吞噬需行内注释豁免（audit 判据）；清理路径须 logger.debug
  mechanism: ci
- rule: 旋钮进 config/ 注册表（未注册名不得读取）；默认值依据带锚点
  mechanism: ci
- rule: 历史文档（docs/log 大档案）append-only——不注入、不做活性检查、不回写
  mechanism: ci
- rule: 压测/复现的子进程必须带硬超时且进度逐行落文件（管道吞 stdout 会把挂死伪装成在跑）——同款坑三次：孤儿 worker 烧 735s、无界压测烧 1543s
  mechanism: script
  # 执行体 = tools/_probe_stress_harness.py（trial 级子进程 + --timeout + 行缓冲日志）；新压测按此规格写，不许裸循环
- rule: 测试不依赖真实视频/GPU 时必须可离线跑；依赖者带 skip 守卫或 -m gpu
  mechanism: ci
- rule: 探针的打桩点必须经 tools/_probe_hooks.py 的 POINTS 表取点，不得直接 import 产品私有符号——重构后只改该表，探针不动
  mechanism: ci
  # 执行体 = tools/_audit_ext.py probe_hooks_resolve（按名引用，编号会重排）；POINTS 选点原则见该文件头
- rule: 新增代码不得引用六个废弃根模块 shim（engine_config/gpu_setup/ocr_native/ocr_trt/segmentation/video_utils）——存量 45 处已迁包内路径，白名单只留两个冻结 shim 可导入性的契约测试；0.14.0 删除时改的就是这两个文件
  mechanism: ci
  # 执行体 = tools/_audit_ext.py no_deprecated_shim_usage（按名引用）；迁移表 docs/MIGRATION.md §1
- rule: 代码风格单一执行面——formatter（双引号、line-length 100）+ lint 精选集 E4/E7/E9/F 不扩；% 格式化与长中文注释行保留（E501/UP 不启用）；docstring=单行中文摘要+可选解释段；命名 snake_case/UPPER_CASE/PascalCase
  mechanism: ci
  # 执行体 = CI ruff check + ruff format --check（政策成文于 pyproject [tool.ruff]）。
  # 2026-10-10 风格轮一次性 format 归位（42 文件，金标复验零行为变更）；tools/tests 不在面内。
- rule: 两级合规——日常改动 --since 快检；发版/依赖迁移/隔周跑全量（纪律审计+index 审计+渲染一致性，后三者一个入口）
  mechanism: script
  # 执行体 = tools/_probe_discipline_audit.py（--since HEAD 快检 / 全量；render --check 已折入审计项 render_consistency）
- rule: 大文档禁止无 offset 整读——>16KB 的 md 先 --toc/--find/单章定位（误读 PERFORMANCE 一次 ≈ 9 倍注入成本）
  mechanism: hook
  # 执行体 = .zcode/config.json PreToolUse(Read) → tools/_hook_guard_read.py（拦截并指路 _doc_section.py；
  #   带 offset/limit 分段读放行；knowledge/conclusions.md 豁免=本就设计为整读）。结构性前提=大文档必须可分章
  #   （_doc_guards.big_doc_section_violations，pytest + 审计同源）。_doc_section 已覆盖全部治理文档+log 单篇。
- rule: 发版清扫——bump 版本时列出前提钉版落后/触发命中的结论清单，逐条复核后翻状态（铁律 9 脚本化）
  mechanism: script
  # 执行体 = tools/conclusions_sweep.py（钉版类别按上下文词判定，只列清单不自动翻状态；--strict 供发版钩子）
- rule: 两仓版本口径一致——DEPENDENCIES.md 的 decord 行必须含本机实际安装的 decord 版本
  mechanism: ci
  # 执行体 = tools/_audit_ext.py decord_pin（import decord 取 __version__；CI 无 decord 时按环境事实跳过）

