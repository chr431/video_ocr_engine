- id: C-08
  conclusion: `auto` 在 h264 多核非最优（本机 CPU+TRT 实测快 1.7~2.8×），**但 auto 恒为 NVDEC 优先是刻意决策（2026-09-10 重申）**：弱 CPU 上 h264 软解可能慢于 NVDEC，且 CPU 解码必然引入资源争用与整机功耗上升，NVDEC 稳妥优先；峰值吞吐留给显式 `decode_backend="cpu"`
  status: active
  premises: 决策权衡稳妥性 > 本机峰值吞吐；机器/场景变化不改此方向（用户拍板）
