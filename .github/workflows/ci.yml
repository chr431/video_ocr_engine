name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 检查面单源 = pyproject [tool.ruff]/[tool.mypy]：一律裸命令（ruff 默认
      # 尊重 .gitignore；tools/probes/ 与 *.md 由 extend-exclude 排除）。
      # S110 豁免=行内 noqa+理由，无登记账本。
      # numpy/pyyaml：mypy/refs/render 面的依赖（refs/render 读 registry yaml）。
      - run: pip install ruff mypy numpy pyyaml
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  institution:
    # 制度面：引用可解析 + 视图一致 + 注册表/弃用/manifest 审计。
    # fetch-depth: 0——refs 的墓碑索引与 render 的证据锚点要读全历史与 tag。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]" pyyaml
      - run: python tools/refs.py check
      - run: python tools/render.py --check
      - run: python tools/_audit_ext.py
        env:
          PYTHONIOENCODING: utf-8

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # fetch-depth: 0——pytest 内含守卫（refs/render/audit），墓碑索引与
      # 证据锚点要读全历史与 tag；depth-1 下三守卫必假红（实测）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install engine
        run: |
          pip install -e ".[dev]" pyyaml
      - name: Run unit tests (CPU, no video / no decord / no GPU)
        run: python -m pytest tests/ -v
        env:
          PYTHONIOENCODING: utf-8  # 中文 skip reason 在 GBK 控制台崩溃
      - name: Verify version single source (constants <-> package)
        run: python -c "import video_ocr_engine as e, video_ocr_engine.config.constants as c; assert e.__version__ == c.__version__"

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel
        run: python -m pip wheel --no-deps . -w dist
      - name: Install into clean venv
        run: |
          python -m venv /tmp/voe-venv
          /tmp/voe-venv/bin/python -m pip install numpy
          /tmp/voe-venv/bin/python -m pip install --no-deps dist/video_ocr_engine-*.whl
      - name: Verify model assets resolve after wheel install
        run: |
          /tmp/voe-venv/bin/python -c "import video_ocr_engine; from video_ocr_engine.ocr.native import _models_dir; from pathlib import Path; p=_models_dir(); assert (p/'PP-OCRv6_rec_small.onnx').is_file(), p; print('model dir:', p)"
