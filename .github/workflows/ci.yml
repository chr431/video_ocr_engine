name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install engine
        run: |
          pip install -e ".[dev]"
      - name: Run unit tests (CPU, no video / no decord / no GPU)
        run: python -m pytest tests/ -v
        env:
          PYTHONIOENCODING: utf-8  # 中文 skip reason 在 GBK 控制台崩溃
      - name: Verify version single source (engine_config <-> package)
        run: python -c "import video_ocr_engine as e, engine_config as c; assert e.__version__ == c.__version__"