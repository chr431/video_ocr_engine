[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-ocr-engine"
# 版本单一事实源在 engine_config.__version__（上层应用读取同一值）：
# 此前此处硬编码 0.8.1 而 engine_config 已是 0.9.0，wheel 与运行时版本
# 不一致会让"装的是哪个版本"无法判断，故改为构建期静态读取。
dynamic = ["version"]
description = "通用视频文本提取引擎：解码 → 像素分段 → 代表帧 → OCR 文本（含置信度）。速度数字识别、字幕提取等通用场景。"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2",
    # CPU OCR 唯一后端（onnxruntime 已于 2026-09-14 移除，C-48）。
    # 上界钉 2026.3 系（本机 2026.3.1 全绿）：2026.4.0 发布当天在
    # windows runner 的 _infer 原生崩溃（同版本上午绿/下午红 = VM 异构
    # 或间歇崩溃，2026-09-28）。换代评估按 C-48 复评触发另起一轮。
    "openvino>=2026.3,<2026.5",
    "psutil>=6",
]
# 说明：decord（自建 fork chr431/decord）、cuda-python / TensorRT 为运行时
# 可选依赖（GPU 解码 / TRT OCR），不在 PyPI 依赖中（fork 仅 GitHub 分发）。

[project.optional-dependencies]
# pyyaml：tests/decode/test_contract.py 对账读 tests/golden/decoder_contract.yaml
dev = ["pytest>=8", "ruff", "mypy", "pyyaml"]   # lint/type 与 CI lint job 同源

[tool.setuptools]
# S9-3：显式列入全部子包——此前仅列顶层包，S9-1 的 config/ domain/
# ocr/ gpu/ pipeline/ 搬迁后不会进 wheel（缺包安装即 import 失败）
packages = [
    "video_ocr_engine",
    "video_ocr_engine.config",
    "video_ocr_engine.decode",
    "video_ocr_engine.domain",
    "video_ocr_engine.gpu",
    "video_ocr_engine.ocr",
    "video_ocr_engine.pipeline",
]

[tool.setuptools.dynamic]
version = {attr = "video_ocr_engine.config.constants.__version__"}

[tool.setuptools.data-files]
# 模型资产随包分发：安装后 _models_dir() 由 ocr_native.__file__ 解析到
# site-packages/assets/ocr_models（与 frozen/source 布局一致）。
"assets/ocr_models" = [
    "assets/ocr_models/PP-OCRv6_rec_small.onnx",
    "assets/ocr_models/ppocrv6_dict.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 2026-10-11 测速轮（用户钦定）：每次运行固定打印慢测试榜——总时长已由
# pytest 尾行给出，此加项保证**新增测试变慢即现形**（0.4s 门槛以下不列，
# 榜取前 15；本机基线见 docs/log 第十一轮追记）。
addopts = "--durations=15 --durations-min=0.4"
markers = [
  "gpu: 需要 GPU + decord fork + 真值视频（S4 双后端等价门禁）",
]

[tool.ruff]
# 风格政策（2026-10-10 治理改革轮成文——此前"只管正确性"是有意决策但
# 未成文，引号混用（266 行单引号）与行宽（最长 158 列）无工具管）：
#   · lint 精选集 E4/E7/E9/F 零违规基线不变；风格类 lint（E501/I001/UP
#     系）仍不启用——% 格式化与长中文注释行是本仓既有风格，不罚；
#   · 表面风格交给 formatter 单一执行面：双引号、line-length 100。
#     2026-10-10 风格轮对全包一次性 `ruff format` 归位（金标复验零行为
#     变更），此后 CI `ruff format --check` 挡增量漂移；
#   · docstring = 单行中文摘要 + 可选解释段（不强制 Google/NumPy 段落）；
#     命名 = snake_case 函数/UPPER_CASE 常量/PascalCase 类（现状已统一）。
# 范围 = video_ocr_engine/（tools/ 探针多为 frozen 证据，不承担 lint/format
# 义务）；执行：ruff check video_ocr_engine/ && ruff format --check video_ocr_engine/
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# domain/ 严格试点（2026-09-20 稳健性轮）+ R2（2026-09-27）扩面
# pipeline/ + decode/：编排与解码访问层纳入检查（非 strict：惰性初始化的
# 协作者字段按 Any 容忍，生命周期由 _driver 顺序保证）。
# 边界：follow_imports=skip——被导入的其他包模块按 Any，不跟随检查
# （试点成熟后再逐层放开）；无 stubs 的第三方按 Any 容忍。
python_version = "3.11"
# 平台语义统一为 win32：产品主面是 Windows（winreg DLL 探测 /
# os.add_dll_directory / TRT / win64 wheel），本地开发即 win32 语义；
# 不设则 CI 的 Linux runner 会以 linux 语义误报 Windows-only API
#（gpu/context.py 的 winreg 块即此例），且本地与 CI 判定分歧。
platform = "win32"
# 0.17.1 注解轮：+ gpu 与 _gpu_kernels.py（裸指针算术文件的静态面）。
# 修法：惰性设备指针/协作者字段显式 `int | None` 注解 + 恒真不变量
# assert 收窄（零行为变更，金标 28/28 复验）；数组显式 `np.ndarray`。
files = ["video_ocr_engine/domain", "video_ocr_engine/pipeline",
         "video_ocr_engine/decode", "video_ocr_engine/gpu",
         "video_ocr_engine/_gpu_kernels.py"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["decord", "decord.*", "cuda", "cuda.*", "psutil", "psutil.*", "tensorrt", "tensorrt_bindings", "tensorrt_bindings.*"]
ignore_missing_imports = true
