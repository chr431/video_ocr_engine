[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-ocr-engine"
# 版本单一事实源在 engine_config.__version__（上层应用读取同一值）：
# 此前此处硬编码 0.8.1 而 engine_config 已是 0.9.0，wheel 与运行时版本
# 不一致会让"装的是哪个版本"无法判断，故改为构建期静态读取。
dynamic = ["version"]
description = "通用视频文本提取引擎：解码 → 像素分段 → 代表帧 → OCR 文本（含置信度）。速度数字识别、字幕提取等通用场景。"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2",
    "openvino>=2026.3",  # CPU OCR 唯一后端（onnxruntime 已于 2026-09-14 移除，C-48）
    "psutil>=6",
]
# 说明：decord（自建 fork chr431/decord）、cuda-python / TensorRT 为运行时
# 可选依赖（GPU 解码 / TRT OCR），不在 PyPI 依赖中（fork 仅 GitHub 分发）。

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]   # lint/type 与 CI lint job 同源

[tool.setuptools]
# S9-3：显式列入全部子包——此前仅列顶层包，S9-1 的 config/ domain/
# ocr/ gpu/ pipeline/ 搬迁后不会进 wheel（缺包安装即 import 失败）
packages = [
    "video_ocr_engine",
    "video_ocr_engine.config",
    "video_ocr_engine.decode",
    "video_ocr_engine.domain",
    "video_ocr_engine.gpu",
    "video_ocr_engine.ocr",
    "video_ocr_engine.pipeline",
]

[tool.setuptools.dynamic]
version = {attr = "video_ocr_engine.config.constants.__version__"}

[tool.setuptools.data-files]
# 模型资产随包分发：安装后 _models_dir() 由 ocr_native.__file__ 解析到
# site-packages/assets/ocr_models（与 frozen/source 布局一致）。
"assets/ocr_models" = [
    "assets/ocr_models/PP-OCRv6_rec_small.onnx",
    "assets/ocr_models/ppocrv6_dict.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: 需要 GPU + decord fork + 真值视频（S4 双后端等价门禁）",
]

[tool.ruff]
# 精选集（2026-09-20 稳健性轮）：E4/E7/E9/F，产品代码零违规基线。
# 范围 = video_ocr_engine/（tools/ 探针多为 frozen 证据，不承担 lint
# 义务）；风格类规则（E501/I001/UP 系）不启用——% 格式化与长中文注释
# 行是本仓既有风格。执行：ruff check video_ocr_engine/
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# domain/ 严格试点（2026-09-20 稳健性轮）：纯算法层、无 CUDA/decord 面。
# 边界：follow_imports=skip——被导入的其他包模块按 Any，不跟随检查
# （试点成熟后再逐层放开）；无 stubs 的第三方按 Any 容忍。
python_version = "3.11"
files = ["video_ocr_engine/domain"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["decord", "cuda", "cuda.*", "psutil", "psutil.*", "tensorrt", "tensorrt_bindings", "tensorrt_bindings.*"]
ignore_missing_imports = true
